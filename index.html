<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="./css/reset.css">
        <link rel="stylesheet" href="./css/estilos.css">
        <link rel="stylesheet" href="./css/flexbox.css">
        <title>VidFlow</title>
        <link rel="shortcut icon" href="./img/Favicon.png" type="image/x-icon">
    </head>
<body>
    <header>
        <nav class="cabecalho_container">
            <div class="logo_item">
                <img src="img/VidFlow--Logo-light-mode.png" alt="logo do VidFlow">
            </div>

            <div class="cabecalho_pesquisar_item">
                <form class="form_pesquisa">
                    <input type="search" class="pesquisar_input" placeholder="pesquisar">
                    <img src="./img/topbar/keyboard.png" alt="icone de teclado" class="pesquisar_input-teclado">
                    <button class="pesquisar_btn">
                        <img src="./img/topbar/search.png" alt="Icone de lupa">
                    </button>
                    <button class="cabecalho_audio">
                        <img src="./img/topbar/Mic.png" alt="Icone de microfone">
                    </button>
                </form>
            </div>

            <div class="cabecalho_icones_item">
                <a href="#" class="cabecalho_videos"></a>
                <a href="#" class="cabecalho_apps"></a>
                <a href="#" class="cabecalho_notificacoes"></a>
                <a href="#" class="cabecalho_avatar"></a>
                <label class="cabecalho_switch">
                    <input type="checkbox" class="cabecalho_switch-input">
                    <span class="cabecalho_switch-slider"></span>
                </label>
            </div>
        </nav>
    </header>

</body>
</html>
